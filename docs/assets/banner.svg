<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">InterviewIQ</title>
  <desc id="d">AI interview coach and resume-matched job finder</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1a33"/>
      <stop offset="1" stop-color="#132c50"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3c46b"/>
      <stop offset="1" stop-color="#b8902c"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b7fae"/>
      <stop offset="1" stop-color="#2a4a75"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b365d"/>
      <stop offset="1" stop-color="#0c1d38"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <pattern id="win" width="10" height="12" patternUnits="userSpaceOnUse">
      <rect x="2" y="3" width="5" height="6" fill="#9fb6d6" opacity=".18"/>
    </pattern>
    <clipPath id="tape"><rect x="0" y="382" width="1280" height="38"/></clipPath>
    <style>
      .serif{font-family:Georgia,'Times New Roman',Times,serif}
      .sans{font-family:'Helvetica Neue',Helvetica,Arial,'Segoe UI',sans-serif}
      .mono{font-family:'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
      .grow{transform-box:fill-box;transform-origin:bottom;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}
      .d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}.d4{animation-delay:.55s}.d5{animation-delay:.7s}.d6{animation-delay:.85s}
      @keyframes grow{from{transform:scaleY(0)}}
      .trend{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 2s ease-out 1s forwards}
      @keyframes draw{to{stroke-dashoffset:0}}
      .dot{opacity:0;animation:show .3s ease-out 2.8s forwards}
      @keyframes show{to{opacity:1}}
      .ticker{animation:tick 36s linear infinite}
      @keyframes tick{to{transform:translateX(-1280px)}}
      .lit{animation:lit 5s steps(1) infinite}
      @keyframes lit{0%,70%{opacity:1}71%,100%{opacity:.35}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}.trend{stroke-dashoffset:0}.dot{opacity:1}}
    </style>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>

  <!-- skyline -->
  <g>
    <rect x="0" y="300" width="70" height="82" fill="url(#tower)"/>
    <rect x="76" y="258" width="54" height="124" fill="url(#tower)"/>
    <rect x="136" y="318" width="80" height="64" fill="url(#tower)"/>
    <rect x="440" y="310" width="66" height="72" fill="url(#tower)"/>
    <rect x="512" y="280" width="46" height="102" fill="url(#tower)"/>
    <rect x="564" y="322" width="90" height="60" fill="url(#tower)"/>
    <rect x="660" y="292" width="58" height="90" fill="url(#tower)"/>
    <rect x="724" y="236" width="64" height="146" fill="url(#tower)"/>
    <path d="M724 236 L756 214 L788 236 Z" fill="#1b365d"/>
    <rect x="794" y="304" width="56" height="78" fill="url(#tower)"/>
    <rect x="1180" y="312" width="100" height="70" fill="url(#tower)"/>
  </g>
  <g fill="url(#win)">
    <rect x="80" y="264" width="46" height="112"/>
    <rect x="516" y="286" width="38" height="92"/>
    <rect x="728" y="242" width="56" height="134"/>
    <rect x="664" y="298" width="50" height="80"/>
  </g>
  <g fill="#e3c46b">
    <rect class="lit" x="92" y="279" width="5" height="6"/>
    <rect class="lit" style="animation-delay:1.2s" x="742" y="267" width="5" height="6"/>
    <rect class="lit" style="animation-delay:2.4s" x="772" y="315" width="5" height="6"/>
    <rect class="lit" style="animation-delay:.6s" x="536" y="327" width="5" height="6"/>
  </g>
  <line x1="0" y1="382" x2="1280" y2="382" stroke="url(#gold)" stroke-width="1.5"/>

  <!-- letterhead -->
  <rect x="80" y="44" width="36" height="2" fill="url(#gold)"/>
  <text x="128" y="50" class="sans" font-size="13" font-weight="600" fill="#d9b85a" letter-spacing="4">ANNUAL REPORT · FY2026</text>

  <text x="76" y="156" class="serif" font-size="92" fill="#ffffff" letter-spacing="1">Interview<tspan fill="#d9b85a">IQ</tspan></text>
  <rect x="80" y="182" width="120" height="3" fill="url(#gold)"/>
  <text x="80" y="226" class="sans" font-size="25" fill="#dbe4f0" letter-spacing=".5">AI interview coach  ·  Resume-matched job finder</text>
  <text x="80" y="260" class="serif" font-size="17" font-style="italic" fill="#9fb1c8">Walk into the boardroom prepared. Eight questions, one rubric, measurable progress.</text>

  <!-- performance chart -->
  <g transform="translate(900 66)">
    <rect width="320" height="210" rx="6" fill="#ffffff" fill-opacity=".05" stroke="#2f4f7a"/>
    <text x="20" y="30" class="sans" font-size="11" font-weight="600" fill="#9fb1c8" letter-spacing="2.5">READINESS</text>
    <text x="300" y="30" text-anchor="end" class="sans" font-size="12" font-weight="700" fill="#5fbf8a">▲ TRENDING UP</text>
    <g stroke="#ffffff" stroke-opacity=".08">
      <line x1="20" y1="70" x2="300" y2="70"/><line x1="20" y1="110" x2="300" y2="110"/><line x1="20" y1="150" x2="300" y2="150"/>
    </g>
    <line x1="20" y1="186" x2="300" y2="186" stroke="#5b7290"/>
    <rect class="grow d1" x="32"  y="150" width="30" height="36" fill="url(#bar)"/>
    <rect class="grow d2" x="76"  y="134" width="30" height="52" fill="url(#bar)"/>
    <rect class="grow d3" x="120" y="140" width="30" height="46" fill="url(#bar)"/>
    <rect class="grow d4" x="164" y="110" width="30" height="76" fill="url(#bar)"/>
    <rect class="grow d5" x="208" y="92"  width="30" height="94" fill="url(#bar)"/>
    <rect class="grow d6" x="252" y="62"  width="30" height="124" fill="url(#gold)"/>
    <polyline class="trend" points="47,138 91,122 135,128 179,98 223,80 267,50" fill="none" stroke="#e3c46b" stroke-width="2.5" stroke-linejoin="round"/>
    <g class="dot" fill="#0a1a33" stroke="#e3c46b" stroke-width="2">
      <circle cx="47" cy="138" r="4"/><circle cx="91" cy="122" r="4"/><circle cx="135" cy="128" r="4"/>
      <circle cx="179" cy="98" r="4"/><circle cx="223" cy="80" r="4"/><circle cx="267" cy="50" r="4"/>
    </g>
    <g class="sans" font-size="10" fill="#7f93ad" text-anchor="middle">
      <text x="47" y="202">S1</text><text x="91" y="202">S2</text><text x="135" y="202">S3</text>
      <text x="179" y="202">S4</text><text x="223" y="202">S5</text><text x="267" y="202">S6</text>
    </g>
  </g>

  <!-- ticker tape -->
  <rect x="0" y="383" width="1280" height="37" fill="#06122a"/>
  <g clip-path="url(#tape)">
    <g class="ticker mono" font-size="13" letter-spacing="1.5">
      <g fill="#c9d4e3">
        <text x="20"   y="406">IIQ.QUESTIONS <tspan fill="#5fbf8a">8 ▲</tspan></text>
        <text x="235"  y="406">IIQ.RUBRIC <tspan fill="#5fbf8a">4-DIM ▲</tspan></text>
        <text x="450"  y="406">IIQ.JOBMATCH <tspan fill="#5fbf8a">0–100 ▲</tspan></text>
        <text x="685"  y="406">IIQ.TESTS <tspan fill="#5fbf8a">128 ▲</tspan></text>
        <text x="880"  y="406">IIQ.FAKE_SCORES <tspan fill="#d9b85a">0 ━</tspan></text>
        <text x="1095" y="406">IIQ.KEYS <tspan fill="#d9b85a">SERVER ━</tspan></text>
      </g>
      <g fill="#c9d4e3" transform="translate(1280 0)">
        <text x="20"   y="406">IIQ.QUESTIONS <tspan fill="#5fbf8a">8 ▲</tspan></text>
        <text x="235"  y="406">IIQ.RUBRIC <tspan fill="#5fbf8a">4-DIM ▲</tspan></text>
        <text x="450"  y="406">IIQ.JOBMATCH <tspan fill="#5fbf8a">0–100 ▲</tspan></text>
        <text x="685"  y="406">IIQ.TESTS <tspan fill="#5fbf8a">128 ▲</tspan></text>
        <text x="880"  y="406">IIQ.FAKE_SCORES <tspan fill="#d9b85a">0 ━</tspan></text>
        <text x="1095" y="406">IIQ.KEYS <tspan fill="#d9b85a">SERVER ━</tspan></text>
      </g>
    </g>
  </g>
</svg>
