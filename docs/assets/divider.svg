<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="18" viewBox="0 0 1280 18" role="presentation">
  <defs>
    <linearGradient id="l" x1="0" x2="1">
      <stop offset="0" stop-color="#ff2a6d" stop-opacity="0"/>
      <stop offset=".2" stop-color="#ff2a6d"/>
      <stop offset=".8" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="p" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-10%" y="-200%" width="120%" height="500%"><feGaussianBlur stdDeviation="2"/></filter>
    <style>
      .run{animation:run 3.2s linear infinite}
      @keyframes run{from{transform:translateX(-160px)}to{transform:translateX(1280px)}}
      @media (prefers-reduced-motion:reduce){.run{animation:none;opacity:0}}
    </style>
  </defs>
  <rect x="0" y="8" width="1280" height="2" fill="url(#l)" filter="url(#g)"/>
  <rect x="0" y="8" width="1280" height="2" fill="url(#l)"/>
  <rect class="run" x="0" y="7" width="160" height="4" fill="url(#p)"/>
  <g fill="#f9f002"><rect x="632" y="5" width="8" height="8" transform="rotate(45 636 9)"/></g>
</svg>
