<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="190" viewBox="0 0 1280 190" role="img" aria-labelledby="t">
  <title id="t">8 questions per session, 4 rubric dimensions, 0 to 100 job match score, 128 backend tests, 0 fabricated scores</title>
  <defs>
    <style>
      .n{font-family:Georgia,'Times New Roman',Times,serif}
      .s{font-family:'Helvetica Neue',Helvetica,Arial,'Segoe UI',sans-serif}
      .bar{transform-box:fill-box;transform-origin:left;animation:fill 1.6s cubic-bezier(.2,.8,.2,1) both}
      .b2{animation-delay:.2s}.b3{animation-delay:.4s}.b4{animation-delay:.6s}.b5{animation-delay:.8s}
      @keyframes fill{from{transform:scaleX(0)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="1280" height="190" rx="8" fill="#f4f6f9"/>
  <!-- card: 244 wide, 12 gap -->
  <g transform="translate(14 18)">
    <rect width="244" height="154" rx="4" fill="#ffffff" stroke="#d5dce6"/>
    <rect width="244" height="4" fill="#0b1f3a"/>
    <text x="20" y="34" class="s" font-size="11" font-weight="700" fill="#5b7290" letter-spacing="2.5">KPI 01 · SCOPE</text>
    <text x="20" y="96" class="n" font-size="54" fill="#0b1f3a">8</text>
    <text x="20" y="122" class="s" font-size="13" fill="#3d5170">Questions per session</text>
    <rect x="20" y="136" width="204" height="4" fill="#0b1f3a" opacity=".12"/>
    <rect class="bar" x="20" y="136" width="204" height="4" fill="#0b1f3a"/>
  </g>
  <g transform="translate(270 18)">
    <rect width="244" height="154" rx="4" fill="#ffffff" stroke="#d5dce6"/>
    <rect width="244" height="4" fill="#2a4a75"/>
    <text x="20" y="34" class="s" font-size="11" font-weight="700" fill="#5b7290" letter-spacing="2.5">KPI 02 · RUBRIC</text>
    <text x="20" y="96" class="n" font-size="54" fill="#0b1f3a">4</text>
    <text x="20" y="122" class="s" font-size="13" fill="#3d5170">Scoring dimensions</text>
    <g fill="#2a4a75">
      <rect class="bar b2" x="20" y="136" width="48" height="4"/><rect class="bar b3" x="72" y="136" width="48" height="4"/>
      <rect class="bar b4" x="124" y="136" width="48" height="4"/><rect class="bar b5" x="176" y="136" width="48" height="4"/>
    </g>
  </g>
  <g transform="translate(526 18)">
    <rect width="244" height="154" rx="4" fill="#ffffff" stroke="#d5dce6"/>
    <rect width="244" height="4" fill="#b8902c"/>
    <text x="20" y="34" class="s" font-size="11" font-weight="700" fill="#5b7290" letter-spacing="2.5">KPI 03 · MATCH</text>
    <text x="20" y="96" class="n" font-size="54" fill="#0b1f3a">0–100</text>
    <text x="20" y="122" class="s" font-size="13" fill="#3d5170">Job match score</text>
    <rect x="20" y="136" width="204" height="4" fill="#b8902c" opacity=".18"/>
    <rect class="bar b3" x="20" y="136" width="150" height="4" fill="#b8902c"/>
  </g>
  <g transform="translate(782 18)">
    <rect width="244" height="154" rx="4" fill="#ffffff" stroke="#d5dce6"/>
    <rect width="244" height="4" fill="#2e8b57"/>
    <text x="20" y="34" class="s" font-size="11" font-weight="700" fill="#5b7290" letter-spacing="2.5">KPI 04 · QUALITY</text>
    <text x="20" y="96" class="n" font-size="54" fill="#0b1f3a">128</text>
    <text x="20" y="122" class="s" font-size="13" fill="#3d5170">Backend tests passing</text>
    <rect class="bar b4" x="20" y="136" width="204" height="4" fill="#2e8b57"/>
  </g>
  <g transform="translate(1038 18)">
    <rect width="228" height="154" rx="4" fill="#ffffff" stroke="#d5dce6"/>
    <rect width="228" height="4" fill="#8a9ab0"/>
    <text x="20" y="34" class="s" font-size="11" font-weight="700" fill="#5b7290" letter-spacing="2.5">KPI 05 · INTEGRITY</text>
    <text x="20" y="96" class="n" font-size="54" fill="#0b1f3a">0</text>
    <text x="20" y="122" class="s" font-size="13" fill="#3d5170">Fabricated scores</text>
    <g transform="rotate(-8 168 78)">
      <rect x="120" y="62" width="92" height="28" rx="3" fill="none" stroke="#2e8b57" stroke-width="2"/>
      <text x="166" y="81" text-anchor="middle" class="s" font-size="12" font-weight="700" fill="#2e8b57" letter-spacing="2.5">AUDITED</text>
    </g>
    <rect x="20" y="136" width="188" height="4" fill="#8a9ab0" opacity=".2"/>
  </g>
</svg>
