<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="190" viewBox="0 0 1280 190" role="img" aria-labelledby="t">
  <title id="t">8 questions per session, 4 rubric dimensions, 0 to 100 job match score, 128 backend tests, 0 fabricated scores</title>
  <defs>
    <filter id="g" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .n{font-family:'Orbitron','Eurostile','Arial Black','Segoe UI Black',Impact,sans-serif;font-weight:900}
      .m{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace;letter-spacing:2px}
      .bar{transform-box:fill-box;transform-origin:left;animation:fill 1.6s cubic-bezier(.2,.8,.2,1) both}
      .b2{animation-delay:.2s}.b3{animation-delay:.4s}.b4{animation-delay:.6s}.b5{animation-delay:.8s}
      @keyframes fill{from{transform:scaleX(0)}}
      .flick{animation:flick 5s steps(1) infinite}
      @keyframes flick{0%,94%,100%{opacity:1}95%{opacity:.3}97%{opacity:.8}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="1280" height="190" fill="#05010d"/>
  <g class="flick">
    <!-- card template: 244 wide, 12 gap -->
    <g transform="translate(14 18)">
      <path d="M0 0 H228 L244 16 V154 H0 Z" fill="#0d0221" stroke="#ff2a6d" stroke-width="1.5"/>
      <text x="20" y="34" class="m" font-size="12" fill="#ff2a6d">SYS.01</text>
      <text x="20" y="98" class="n" font-size="54" fill="#f5f0ff" filter="url(#g)">08</text>
      <text x="20" y="124" class="m" font-size="13" fill="#d1f7ff">QUESTIONS / SESSION</text>
      <rect x="20" y="138" width="204" height="4" fill="#ff2a6d" opacity=".2"/>
      <rect class="bar" x="20" y="138" width="204" height="4" fill="#ff2a6d"/>
    </g>
    <g transform="translate(266 18)">
      <path d="M0 0 H228 L244 16 V154 H0 Z" fill="#0d0221" stroke="#00f0ff" stroke-width="1.5"/>
      <text x="20" y="34" class="m" font-size="12" fill="#00f0ff">SYS.02</text>
      <text x="20" y="98" class="n" font-size="54" fill="#f5f0ff" filter="url(#g)">04</text>
      <text x="20" y="124" class="m" font-size="13" fill="#d1f7ff">RUBRIC DIMENSIONS</text>
      <g fill="#00f0ff">
        <rect class="bar b2" x="20" y="138" width="48" height="4"/><rect class="bar b3" x="72" y="138" width="48" height="4"/>
        <rect class="bar b4" x="124" y="138" width="48" height="4"/><rect class="bar b5" x="176" y="138" width="48" height="4"/>
      </g>
    </g>
    <g transform="translate(518 18)">
      <path d="M0 0 H228 L244 16 V154 H0 Z" fill="#0d0221" stroke="#f9f002" stroke-width="1.5"/>
      <text x="20" y="34" class="m" font-size="12" fill="#f9f002">SYS.03</text>
      <text x="20" y="98" class="n" font-size="54" fill="#f5f0ff" filter="url(#g)">0–100</text>
      <text x="20" y="124" class="m" font-size="13" fill="#d1f7ff">JOB MATCH SCORE</text>
      <rect x="20" y="138" width="204" height="4" fill="#f9f002" opacity=".2"/>
      <rect class="bar b3" x="20" y="138" width="150" height="4" fill="#f9f002"/>
    </g>
    <g transform="translate(770 18)">
      <path d="M0 0 H228 L244 16 V154 H0 Z" fill="#0d0221" stroke="#39ff14" stroke-width="1.5"/>
      <text x="20" y="34" class="m" font-size="12" fill="#39ff14">SYS.04</text>
      <text x="20" y="98" class="n" font-size="54" fill="#f5f0ff" filter="url(#g)">128</text>
      <text x="20" y="124" class="m" font-size="13" fill="#d1f7ff">BACKEND TESTS PASS</text>
      <rect class="bar b4" x="20" y="138" width="204" height="4" fill="#39ff14"/>
    </g>
    <g transform="translate(1022 18)">
      <path d="M0 0 H228 L244 16 V154 H0 Z" fill="#0d0221" stroke="#bf5af2" stroke-width="1.5"/>
      <text x="20" y="34" class="m" font-size="12" fill="#bf5af2">SYS.05</text>
      <text x="20" y="98" class="n" font-size="54" fill="#f5f0ff" filter="url(#g)">00</text>
      <text x="20" y="124" class="m" font-size="13" fill="#d1f7ff">FABRICATED SCORES</text>
      <rect x="20" y="138" width="204" height="4" fill="#bf5af2" opacity=".2"/>
    </g>
  </g>
</svg>
